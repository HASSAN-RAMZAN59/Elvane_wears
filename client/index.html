    <title>Elvane Wear — Luxury 3D Atelier E-Commerce</title>
    <meta name="description" content="Elvane Wear Atelier: Engineered for movement. Designed for stillness. Complete luxury minimalist tracksuit sets crafted from pure cashmere, merino wool, and organic pima cotton in Pakistan." />
    <meta name="google-site-verification" content="EYQ0n_s3vddj6NjdYUTaQo9v40Z_XjA0XDsWiL9SBdk" />
    <link rel="canonical" id="canonical-url" href="https://elvanewears.com/" />
    <meta property="og:url" id="og-url" content="https://elvanewears.com/" />
    <script>
      (function() {
        try {
          var link = document.getElementById('canonical-url') || document.querySelector('link[rel="canonical"]');
          var ogUrl = document.getElementById('og-url') || document.querySelector('meta[property="og:url"]');
          if (window.location) {
            var base = 'https://elvanewears.com';
            var p = window.location.pathname || '/';
            if (p.length > 1 && p.endsWith('/')) {
              p = p.replace(/\/+$/, '');
            }
            if (p === '/return-policy') p = '/returns';
            var target = p === '/' ? base + '/' : base + p;
            if (link) link.setAttribute('href', target);
            if (ogUrl) ogUrl.setAttribute('content', target);
          }
        } catch (e) {}
      })();
    </script>
