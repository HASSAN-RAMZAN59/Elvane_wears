name: Auto Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Frontend Dependencies & Build
        env:
          VITE_API_URL: https://elvanewears.com
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build

      - name: 🚀 Deploy Frontend to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./client/dist/
          server-dir: ./elvanewears.com/
          dangerous-clean-slate: false

      - name: 🔄 Prepare Backend Restart Trigger
        run: |
          mkdir -p ./server/tmp
          touch ./server/tmp/restart.txt

      - name: 🚀 Deploy Backend to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./server/
          server-dir: ./elvane-backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            uploads/**

